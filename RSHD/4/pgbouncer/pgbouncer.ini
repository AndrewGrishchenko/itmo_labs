[databases]
app_rw = host=primary port=5432 dbname=studs
app_ro = host=replica port=5432 dbname=studs

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 100
default_pool_size = 20

log_connections = 1
log_disconnections = 1